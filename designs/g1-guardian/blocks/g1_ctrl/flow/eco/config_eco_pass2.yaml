# LibreLane Classic flow configuration for the G1 digital macro (g1_digital),
# run7: config.yaml plus the density-neutral TMR copy spread (tmr_spread.py).
# Adapted from ChipDesign-BV/spi-slave-ihp flow/config.yaml (Apache-2.0,
# commit 7eb03a4bdd7b9409f290261f301f80747fe8d437) and
# IHP-GmbH/ihp-sg13g2-librelane-template librelane/config.yaml (Apache-2.0,
# commit 0418301723d86133de686ef743cfd668bb3d11d4).
# Run from the repository root:
#   G1_WORKDIR=designs/g1-guardian/blocks/g1_ctrl/flow flow/run.sh \
#     librelane config.yaml --pdk ihp-sg13g2 --pdk-root /foss/pdks --manual-pdk \
#     --run-tag run7 --save-views-to /work/build/g1_digital/final_run7
meta:
  version: 2
  flow: Classic
  substituting_steps:
    # magic reports overlaps between abutted cells that are not real
    Checker.IllegalOverlap: null
    # TMR copy separation (run7): apply the placement seeds *before* the
    # post-global-placement design repair, so repair_design buffers the vote
    # nets at their final length. In the stock Classic flow the manual
    # placement comes after the repair (run6: 81 max-slew violations on the
    # unrepaired vote nets).
    Odb.ManualGlobalPlacement: null
    "-OpenROAD.RepairDesignPostGPL": Odb.ManualGlobalPlacement
    # clock-root fanout split after CTS (eco/librelane_plugin_g1eco)
    "+OpenROAD.CTS": G1.SplitClockRoot

DESIGN_NAME: g1_digital
VERILOG_FILES:
  - dir::../../rtl_eco_20260925/g1_sync2.v
  - dir::../../rtl_eco_20260925/g1_serial.v
  - dir::../../rtl_eco_20260925/g1_trip_timer.v
  - dir::../../rtl_eco_20260925/g1_regfile.v
