# LibreLane Classic flow configuration for the G1 digital macro (g1_digital).
# Adapted from ChipDesign-BV/spi-slave-ihp flow/config.yaml (Apache-2.0,
# commit 7eb03a4bdd7b9409f290261f301f80747fe8d437) and
# IHP-GmbH/ihp-sg13g2-librelane-template librelane/config.yaml (Apache-2.0,
# commit 0418301723d86133de686ef743cfd668bb3d11d4).
# Run from the repository root:
#   G1_WORKDIR=designs/g1-guardian/blocks/g1_ctrl/flow flow/run.sh \
#     librelane config.yaml --pdk ihp-sg13g2 --pdk-root /foss/pdks --manual-pdk \
#     --run-tag <tag> --save-views-to /work/build/g1_digital/final
meta:
  version: 2
  flow: Classic
  substituting_steps:
    # magic reports overlaps between abutted cells that are not real
    Checker.IllegalOverlap: null

DESIGN_NAME: g1_digital
VERILOG_FILES:
  - dir::../rtl/g1_sync2.v
  - dir::../rtl/g1_serial.v
  - dir::../rtl/g1_trip_timer.v
  - dir::../rtl/g1_regfile.v
  - dir::../../g1_seu/rtl/g1_tmr_reg.v
  - dir::../../g1_seu/rtl/g1_seu_chain.v
  - dir::../../g1_seu/rtl/g1_seu.v
  - dir::../rtl/g1_digital_top.v
  - dir::../rtl/g1_digital.v
VERILOG_DEFINES:
  - FUNCTIONAL

# 1.2 V core library
STD_CELL_LIBRARY: sg13g2_stdcell

CLOCK_PORT: osc_clk
CLOCK_PERIOD: 100
PNR_SDC_FILE: dir::g1_digital.sdc
SIGNOFF_SDC_FILE: dir::g1_digital.sdc
FALLBACK_SDC: dir::g1_digital.sdc

# SEU register lengths built (RTL defaults are the same; listed here so the
# flow log states them)
SYNTH_PARAMETERS:
  - SEU_PLAIN_LEN=256
  - SEU_TMR_LEN=128

# Macro budget from the chip floorplan: at most 360 x 360 um
FP_SIZING: absolute
DIE_AREA: [0, 0, 360, 360]
CORE_AREA: [8, 8, 352, 352]
PL_TARGET_DENSITY_PCT: 75
GRT_ALLOW_CONGESTION: true

# Power: stripes on TopMetal1/TopMetal2 per the PDK defaults, no core ring
# (the chip-level PDN connects to the stripe pins through PDN_MACRO_CONNECTIONS)
PDN_CORE_RING: false
VDD_NETS: [VDD]
GND_NETS: [VSS]

# Antenna: run4 inserted 1496 heuristic diodes (8.1 k um2) whose input
# capacitance, added after the design repair, produced 36 max-slew violations
# (1.53 vs 1.5 ns) at the slow corner. run5: diodes only where the antenna
# check fails (OpenROAD repair_antennas, GRT and DRT iterations), design repair
# with a 30 % slew margin and a second repair pass after global routing.
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_ANTENNA_REPAIR: true
DESIGN_REPAIR_MAX_SLEW_PCT: 30
DESIGN_REPAIR_MAX_CAP_PCT: 30
RUN_POST_GRT_DESIGN_REPAIR: true

