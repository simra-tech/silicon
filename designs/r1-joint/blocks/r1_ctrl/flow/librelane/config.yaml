# LibreLane Classic flow for the r1_ctrl macro (revision 0.6: RTL 0.5, S7 pin template pins_v06.cfg,
# max fanout 8; revision 0.4 was the D10 floorplan constraint; 0.3 used a relative 55 % start utilisation).
# Structure follows designs/g1-guardian/blocks/g1_ctrl/flow/config.yaml.
# Run with flow/librelane/run_harden.sh, which copies this file, the SDC and the
# RTL to the bulk results root, so run directories never land in the repository.
# Revision 0.3 changes: start utilisation 55 % (trial t1 at 70 % reached 82.6 %
# after CTS and did not finish detailed routing in 2 h); router and STA threads
# fixed to the 4 allocated CPUs (t1 left DRT_THREADS unset).
meta:
  version: 2
  flow: Classic
  substituting_steps:
    # as in G1: magic reports overlaps between abutted cells that are not real
    Checker.IllegalOverlap: null

DESIGN_NAME: r1_ctrl_top
VERILOG_FILES:
  - dir::../rtl/r1_sync2.v
  - dir::../rtl/r1_lib.v
  - dir::../rtl/r1_sinlut.v
  - dir::../rtl/r1_pos.v
  - dir::../rtl/r1_adcw.v
  - dir::../rtl/r1_gate.v
  - dir::../rtl/r1_icor.v   # revision 0.9 (D27)
  - dir::../rtl/r1_safe.v
  - dir::../rtl/r1_cmpcal.v
  - dir::../rtl/r1_tapidx.v
  - dir::../rtl/r1_idrom.v
  - dir::../rtl/r1_biss.v
  - dir::../rtl/r1_spi.v
  - dir::../rtl/r1_regs.v
  - dir::../rtl/r1_ctrl_top.v
VERILOG_DEFINES:
  - SYNTHESIS
  # revision 0.3: flip-flop register file (rtl/r1_lib.v)
  - R1_CFG_FLOPS
  # revision 0.4: one clock gate per configuration word (flip-flops on the gated clock)
  - R1_CFG_GATED
# the configuration register file is latch-based by design (r1_lib.v)
LINTER_ERROR_ON_LATCH: false

STD_CELL_LIBRARY: sg13g2_stdcell

CLOCK_PORT: clk
CLOCK_PERIOD: 23.81
PNR_SDC_FILE: dir::r1_ctrl_pnr.sdc   # t11: set_max_fanout 7 for repair; SIGNOFF_SDC_FILE keeps 8
SIGNOFF_SDC_FILE: dir::r1_ctrl.sdc
FALLBACK_SDC: dir::r1_ctrl.sdc

# Booth multiplier recoding (as in flow/synth.tcl)
SYNTH_STRATEGY: AREA 0
SYNTH_MUL_BOOTH: true

# Revision 0.6 (INTERFACES.md, decision 2026-10-22): macro box 532 x 679 um, core inset 10.7 um per side
# (510.6 x 657.6 = 335 800 um2 before snapping; t9f placed 247 110 um2 = 74.06 % of the snapped core).
# Revision 0.4 had 520 x 664 um (75 % = 240 300 um2).
FP_SIZING: absolute
DIE_AREA: [0, 0, 532, 679]
CORE_AREA: [10.7, 10.7, 521.3, 668.3]
PL_TARGET_DENSITY_PCT: 80
# Revision 0.6: exact pin slots from the S7 C4 floorplan (gen_pins_v06.py); IO_PIN_*_LAYER from the PDK
IO_PIN_ORDER_CFG: dir::pins_v07.cfg   # 0.7: pins_v06 (532 x 679, east pitch 1.68 um) + cur_trk at the next south ADC slot (local x 280.80); PIN_STRIDE_E=2 PINS_V07=1 gen_pins_v06.py 532 679
# Revision 0.6: the library limit (default_max_fanout 8) is the sign-off limit; the PDK default of the
# flow is 10. Used by synthesis (ABC buffering) and by the resizer; the SDC carries the same value.
# t9f ended with one net at 9 loads (8 logic loads plus the antenna diode added after the fanout repair). Setting 7 here (run t10) changed
# nothing: the netlist was bit-identical to t9f. The repair limit comes from the SDC; see PNR_SDC_FILE.
MAX_FANOUT_CONSTRAINT: 8
# Revision 0.4: small clock buffers and larger sink clusters. With one clock gate per configuration
# word, the 67 gated nets each got a buf_16 root and three buffers with the default list (clock
# buffer area 15.5 k um2 against 7 k in 0.3; studies t7c to t7h, README revision 0.4).
CTS_ROOT_BUFFER: sg13g2_buf_2
CTS_CLK_BUFFERS:
  - sg13g2_buf_2
CTS_SINK_CLUSTERING_SIZE: 30
CTS_SINK_CLUSTERING_MAX_DIAMETER: 120
# Revision 0.6 (t9c and later): balanced clock-tree levels and 60 um between buffers close the clock-root fanout
# violations without a waiver.
CTS_BALANCE_LEVELS: true
CTS_DISTANCE_BETWEEN_BUFFERS: 60
DRT_THREADS: 4
STA_THREADS: 4
GRT_ALLOW_CONGESTION: true

PDN_CORE_RING: false
VDD_NETS: [VDD]
GND_NETS: [VSS]

RUN_HEURISTIC_DIODE_INSERTION: false
RUN_ANTENNA_REPAIR: true
# t12: 40 (t11 ended with 4 pins at 1.52 ns against the 1.50 ns slow-corner limit after routing)
DESIGN_REPAIR_MAX_SLEW_PCT: 40
DESIGN_REPAIR_MAX_CAP_PCT: 30
RUN_POST_GRT_DESIGN_REPAIR: true
