# Revision 0.9, run t28 (final RTL 0.9): the t24 settings (= 0.8 record t22: t18 hold strategy + post-GRT timing repair,
# hold margin 0.15 ns) with CTS_DELAY_BUFFER_DERATE_PCT 0 (no CTS latency-balancing delay buffers). Reason: t24, t25
# (sink clustering size 28) and t26 (cluster diameter 100 um) all stopped at the disconnected-pins checker. In each run
# OpenROAD CTS left the clock input A of the clock-gate AND of u_regs.g_w[6].u_wb unconnected. The 20 delay buffers of
# the latency balancing drive the clock-gate AND inputs, and the lost pin is one of these loads. Without delay buffers
# the gated clocks arrive later than the ungated clock by the clock-gate delay; the post-CTS and post-GRT hold repair
# and the sign-off STA cover this skew. Same DIE_AREA 532 x 679, pins_v07, sign-off SDC.
PNR_SDC_FILE: dir::r1_ctrl_pnr6h.sdc
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.15
CTS_DELAY_BUFFER_DERATE_PCT: 0
DRT_THREADS: 2
STA_THREADS: 2
