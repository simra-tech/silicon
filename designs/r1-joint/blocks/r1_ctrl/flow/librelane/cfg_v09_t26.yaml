# Revision 0.9, run t26 (final RTL 0.9): the t24 settings (= 0.8 record t22: t18 hold strategy + post-GRT timing repair,
# hold margin 0.15 ns) with CTS_SINK_CLUSTERING_MAX_DIAMETER 100 um instead of 120. Reason: t24 stopped at the
# disconnected-pins checker because OpenROAD CTS (latency-balancing delay buffers) left the clock input A of one clock-gate
# AND (u_regs.g_w[6].u_wb gated clock) unconnected. t25 (sink clustering size 28) produced the identical tree (the
# clusters are limited by the 120 um diameter, not by the size), so the diameter is changed to get a different tree
# while keeping the delay buffers of the 0.8 record configuration. Same DIE_AREA 532 x 679, pins_v07, sign-off SDC.
PNR_SDC_FILE: dir::r1_ctrl_pnr6h.sdc
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.15
CTS_SINK_CLUSTERING_MAX_DIAMETER: 100
DRT_THREADS: 2
STA_THREADS: 2
